<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة الإدارة - يد بيد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background:#f5faff; }
    .admin-wrapper {max-width:560px;margin:30px auto;padding:24px;background:#ffffff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06);font-family:'Tajawal',sans-serif;}
    h1 {margin-top:0;font-size:1.4rem;color:#1976d2;text-align:center;}
    form {margin:0 0 18px 0;}
    label {display:block;font-weight:600;margin-bottom:4px;color:#0d3c55;font-size:.85rem;}
    input {width:100%;padding:10px 12px;border:1px solid #bcd6e2;border-radius:8px;font-family:inherit;font-size:.9rem;box-sizing:border-box;}
    input:focus {outline:2px solid #81d4fa;border-color:#81d4fa;}
    .btn {background:#1976d2;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
    .btn.secondary {background:#607d8b;}
    .btn:disabled {opacity:.5;cursor:not-allowed;}
    .section {padding:14px 16px;border:1px solid #d0e6ef;border-radius:12px;background:#e9f6fb;margin-bottom:18px;}
    .hidden {display:none !important;}
    .status {font-size:.8rem;margin-top:6px;min-height:18px;}
    .error {color:#d32f2f;}
    .success {color:#2e7d32;}
    .forms-grid {display:grid;gap:14px;}
    .pair {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    footer {text-align:center;margin-top:22px;font-size:.7rem;color:#777;}
    /* التبويبات */
    .tabs-bar {display:flex;gap:8px;margin:10px 0 18px 0;}
    .tab-btn {flex:1;background:#e0f2f8;border:1px solid #bcd6e2;padding:10px 0;border-radius:10px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:600;color:#1976d2;font-size:.85rem;transition:.15s;}
    .tab-btn.active {background:#1976d2;color:#fff;box-shadow:0 4px 12px rgba(25,118,210,.25);}
    .tab-section {display:none;}
    .tab-section.active {display:block;}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <div class="admin-wrapper">
    <h1>لوحة الإدارة</h1>

    <!-- شاشة الدخول -->
    <div id="login-view">
      <form id="login-form" autocomplete="on">
        <div class="section">
          <label for="login-email">البريد الإلكتروني</label>
          <input id="login-email" type="email" required placeholder="admin@example.com" />
          <label for="login-password" style="margin-top:10px;">كلمة المرور</label>
          <input id="login-password" type="password" required placeholder="••••••" />
          <button class="btn" style="margin-top:14px;" type="submit" id="login-btn">تسجيل الدخول</button>
          <div id="login-status" class="status"></div>
        </div>
      </form>
    </div>

    <!-- محتوى الإدارة بعد تسجيل الدخول -->
    <div id="admin-view" class="hidden">
      <div class="section" style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:600;color:#0d3c55;font-size:.9rem">مرحبا <span id="admin-email"></span></div>
        <button class="btn secondary" id="logout-btn">تسجيل خروج</button>
      </div>

      <div class="tabs-bar" id="tabs-bar" style="display:none;">
        <button type="button" data-tab="donors" class="tab-btn active" id="tab-donors">المتبرعون</button>
        <button type="button" data-tab="payments" class="tab-btn" id="tab-payments">وسائل الدفع</button>
      </div>

      <div id="donor-section" class="tab-section active">
      <form id="donor-form">
        <div class="section">
          <h3 style="margin:0 0 10px 0;font-size:1rem;color:#1976d2;">إضافة متبرع جديد</h3>
          <label for="donor_name">اسم المتبرع</label>
          <input id="donor_name" required />
          <label for="amount_usd" style="margin-top:10px;">المبلغ (دولار)</label>
          <input id="amount_usd" type="number" min="0" step="0.01" required />
          <button class="btn" style="margin-top:14px;" type="submit" id="add-donor-btn">إضافة المتبرع</button>
          <div id="donor-status" class="status"></div>
        </div>
      </form>

      <div class="section" style="margin-top:8px;">
        <h3 style="margin:0 0 10px 0;font-size:1rem;color:#1976d2;">آخر المتبرعين</h3>
        <table id="donors-table" style="width:100%;border-collapse:collapse;font-size:.8rem;">
          <thead>
            <tr style="background:#d7eef7;">
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">#</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">الاسم</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">المبلغ</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">التاريخ</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">إجراءات</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      </div><!-- نهاية donor-section -->

      <div id="payment-section" class="tab-section">
      <form id="payment-form" style="margin-top:0;">
        <div class="section">
          <h3 style="margin:0 0 10px 0;font-size:1rem;color:#1976d2;">إضافة وسيلة دفع</h3>
          <label for="title">العنوان</label>
          <input id="title" required />
          <label for="entity_name" style="margin-top:10px;">اسم الجهة</label>
          <input id="entity_name" required />
            <label for="phone" style="margin-top:10px;">رقم الجوال / الحساب</label>
          <input id="phone" required />
          <button class="btn" style="margin-top:14px;" type="submit" id="add-payment-btn">إضافة الوسيلة</button>
          <div id="payment-status" class="status"></div>
        </div>
      </form>

      <div class="section" style="margin-top:8px;">
        <h3 style="margin:0 0 10px 0;font-size:1rem;color:#1976d2;">وسائل الدفع المخزنة</h3>
        <table id="payments-table" style="width:100%;border-collapse:collapse;font-size:.8rem;">
          <thead>
            <tr style="background:#d7eef7;">
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">#</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">العنوان</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">الجهة</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">الهاتف/الحساب</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">التاريخ</th>
              <th style="text-align:right;padding:6px;border:1px solid #c2dbe5;">إجراءات</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
  </div>
  </div><!-- نهاية payment-section -->
    </div>

    <footer>© يد بيد - صفحة الإدارة</footer>
  </div>
</body>
</html>
